apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.timeslice
spec:
  selectors:
  - cel:
      expression: "device.allowMultipleAllocations == true && device.driver == 'gpu.nvidia.com' && device.attributes['gpu.nvidia.com'].type == 'gpu'"
  extendedResourceName: timeslice.io/gpu
