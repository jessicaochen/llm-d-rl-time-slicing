# Oversubscription edge cases: four sampler deployments with 1, 2, 3, and 4
# replicas, same properties as 01 (sampler pool, one gpu.timeslice claim per
# pod, required per-deployment anti-affinity). With a 3-node pool, the fourth
# replica of sampler-r4 cannot satisfy anti-affinity and must stay Pending;
# everything else should schedule since shares are unlimited.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampler-r1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sampler-r1
  template:
    metadata:
      labels:
        app: sampler-r1
        experiment: dra-multihost-oversub
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: sampler-gpu-pool
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: timeslice.io/shared
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sampler-r1
              topologyKey: kubernetes.io/hostname
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: timeslice-gpu
      containers:
        - name: sampler
          image: registry.k8s.io/pause:3.10
          resources:
            claims:
              - name: gpu
